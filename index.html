<!doctype html>
<html lang="en">
    <head>
        <title>Flashcards</title>
        <link rel="stylesheet" type="text/css" href="styles.css" />
        <link rel="icon" href="../seedling.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta charset="UTF-8" />
    </head>

    <body>
        <main id="main-menu">
            <h1 style="margin-bottom: 20px" class="gradient-text">
                Flashcards
            </h1>
            <div id="collections"></div>
        </main>
        <main id="flashcards">
            <h1 style="font-size: 30px" id="title"></h1>
            <div id="question-container">
                <p id="question"></p>
                <p id="answer"></p>
                <p id="number"></p>
            </div>
            <div id="buttons-container">
                <button id="back-to-menu" class="menu-button">📚</button>
                <button id="previous" class="menu-button">⬅️</button>
                <button id="next" class="menu-button">➡️</button>
                <button id="shuffle-toggle" class="menu-button">🔀</button>
                <button id="list-toggle" class="menu-button">📄</button>
            </div>
            <ol id="list-container"></ol>
        </main>

        <script src="script.js"></script>
    </body>
</html>
