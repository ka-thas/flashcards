<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Ka Thas</title>
        <link
            rel="stylesheet"
            type="text/css"
            href="../../css/stylesheet.css"
        />
        <link rel="icon" href="./assets/images/icon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta charset="UTF-8" />
        <style>
            main {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                padding: 20px;
                text-align: center;
                max-width: 450px;
            }
            #next,
            button {
                font-size: 20px;
                font-family: Arial, Helvetica, sans-serif;
                color: #151;
                padding: 10px 20px;
                border: none;
                border-radius: 100px;
                background-color: #f1f1f1;
                cursor: pointer;
            }
            #question {
                font-size: 30px;
                font-family: Arial, Helvetica, sans-serif;

                text-align: left;
                height: 300px;
                background-color: #f1f1f111;
                padding: 20px;
                border-radius: 20px;
                border-top: 1px solid #dfda;
                box-shadow: 0px 5px 5px #0202;
            }
            #flashcards {
                display: none;
            }
        </style>
    </head>
    <body>
        <main id="menu">
            <h1>Choose a collection</h1>
            <div id="collections"></div>
        </main>
        <main id="flashcards">
            <h1 style="font-size: 30px" id="title"></h1>
            <br />

            <h2 id="question"></h2>
            <br />

            <button id="back-to-menu">Menu</button>
            <button id="next">Next →</button>
            <footer>
                <p style="text-align: center">🌱</p>
            </footer>
        </main>
        <script>
            let question = document.getElementById("question");
            let next = document.getElementById("next");
            let title = document.getElementById("title");
            let backToMenu = document.getElementById("back-to-menu");
            let questions = [];
            let data = [];

            async function fetchCollections() {
                const response = await fetch("data.json");
                data = await response.json();
                console.log(data);
                const collectionsDiv = document.getElementById("collections");
                for (const collectionName in data) {
                    const button = document.createElement("button");
                    button.textContent = data[collectionName].title;
                    button.onclick = () => loadCollection(collectionName);
                    button.id = "next";
                    button.style.margin = "10px";
                    collectionsDiv.appendChild(button);
                }
            }

            function loadCollection(name) {
                document.getElementById("menu").style.display = "none";
                document.getElementById("flashcards").style.display = "block";
                title.textContent = data[name].title;
                questions = data[name].questions;

                let currentQuestion = Math.floor(
                    Math.random() * questions.length
                );

                question.textContent = questions[currentQuestion];
            }

            fetchCollections();

            next.addEventListener("click", () => {
                currentQuestion = Math.floor(Math.random() * questions.length);
                question.textContent = questions[currentQuestion];
            });

            backToMenu.addEventListener("click", () => {
                document.getElementById("menu").style.display = "block";
                document.getElementById("flashcards").style.display = "none";
            });
        </script>
    </body>
</html>
