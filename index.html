<!doctype html>
<html lang="en" data-theme="light">
    <head>
        <title>Flashcards</title>
        <link rel="stylesheet" type="text/css" href="styles.css" />
        <link rel="icon" href="../seedling.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta charset="UTF-8" />
        <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
        <script src="https://unpkg.com/papaparse@5/papaparse.min.js"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />
        <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
    </head>

    <body>
        <main id="main-menu">
            <h1 style="margin-bottom: 20px" class="gradient-text">
                Flashcards
            </h1>
            <div id="collections"></div>
        </main>
        <main id="flashcards">
            <div id="flashcards-header">
                <button id="back-to-menu" class="menu-button"><i data-lucide="arrow-left"></i></button>
                <h1 style="font-size: 30px" id="title"></h1>
            </div>
            <div id="question-container">
                <p id="question"></p>
                <p id="answer"></p>
                <p id="number"></p>
            </div>
            <div id="buttons-container">
                <button id="previous" class="menu-button"><i data-lucide="chevron-left"></i></button>
                <button id="next" class="menu-button"><i data-lucide="chevron-right"></i></button>
                <button id="shuffle-toggle" class="menu-button"><i data-lucide="shuffle"></i></button>
                <button id="list-toggle" class="menu-button"><i data-lucide="list"></i></button>
            </div>
            <ol id="list-container"></ol>
        </main>

        <script src="script.js"></script>
        <script>lucide.createIcons();</script>
    </body>
</html>
