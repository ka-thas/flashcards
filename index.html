<!doctype html>
<html lang="en" data-theme="light">
    <head>
        <title>Flashcards</title>
        <script>
            // Apply saved/preferred theme before first paint to avoid a flash.
            (function () {
                const t = localStorage.getItem("theme")
                    || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
                document.documentElement.setAttribute("data-theme", t);
            })();
        </script>
        <link rel="stylesheet" type="text/css" href="styles.css" />
        <link rel="icon" href="../seedling.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta charset="UTF-8" />

        <!-- PWA / offline -->
        <link rel="manifest" href="manifest.json" />
        <meta name="theme-color" content="#000000" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />
        <meta name="apple-mobile-web-app-title" content="Memset" />
        <link rel="apple-touch-icon" href="apple-touch-icon.png" />
        <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
        <script src="https://unpkg.com/papaparse@5/papaparse.min.js"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />
        <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
    </head>

    <body>
        <main id="main-menu">
            <button id="theme-toggle" class="menu-button" aria-label="Toggle dark mode"><i data-lucide="moon"></i></button>
            <h1 style="margin-bottom: 20px" class="gradient-text">
                Flashcards
            </h1>
            <div id="collections"></div>
        </main>
        <main id="flashcards">
            <div id="flashcards-header">
                <button id="back-to-menu" class="menu-button"><i data-lucide="arrow-left"></i></button>
                <h1 id="title"></h1>
            </div>
            <div id="question-container">
                <p id="question"></p>
                <p id="answer"></p>
                <p id="number"></p>
            </div>
            <div id="buttons-container">
                <button id="previous" class="menu-button"><i data-lucide="chevron-left"></i></button>
                <button id="next" class="menu-button"><i data-lucide="chevron-right"></i></button>
                <button id="shuffle-toggle" class="menu-button"><i data-lucide="shuffle"></i></button>
                <button id="list-toggle" class="menu-button"><i data-lucide="list"></i></button>
            </div>
            <ol id="list-container"></ol>
        </main>

        <script src="script.js"></script>
        <script>lucide.createIcons();</script>
        <script>
            // Register the service worker for offline support.
            if ("serviceWorker" in navigator) {
                window.addEventListener("load", () => {
                    navigator.serviceWorker.register("sw.js");
                });
            }
        </script>
    </body>
</html>
